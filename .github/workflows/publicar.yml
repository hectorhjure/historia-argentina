name: Publicar sitio

# El sitio se reconstruye solo en cada push. Es deliberado: la versión
# publicada de este corpus ya quedó desactualizada una vez, y el modo de
# evitar que vuelva a pasar es que nadie tenga que acordarse de reconstruirla.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Construir el sitio
        run: python3 sitio/build.py

      - name: Control de calidad
        run: python3 sitio/qa.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
